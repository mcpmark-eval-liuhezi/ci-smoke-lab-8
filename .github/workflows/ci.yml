name: demo-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write demo file
        run: |
          echo "demo-build smoke artifact" > build-demo.txt
          cat build-demo.txt
      - name: Upload demo-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: build-demo.txt
